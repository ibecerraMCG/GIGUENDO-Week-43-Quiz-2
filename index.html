<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 43 Practice Quiz 2</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        [data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }

        [data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }

        [data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }

        [data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 43 Practice Quiz 2</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button in Header -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>

                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Female Reproductive Histology ---
            {
                section: "Female Reproductive Histology",
                fullLO: "LO1: List the organs of the female reproductive tract and identify their locations and functions (relative to menstrual cycle).",
                question: "A 28-year-old woman is evaluated for infertility. A specialized imaging study is used to track the path of an ovulated oocyte. After the oocyte is released from the ovary, it enters the oviduct. According to normal reproductive physiology, in which specific anatomical segment of the female reproductive tract does fertilization normally occur?",
                options: {
                    A: "Ampulla of the oviduct",
                    B: "Cervical canal",
                    C: "Infundibulum of the oviduct",
                    D: "Isthmus of the oviduct",
                    E: "Uterine cavity"
                },
                correctAnswer: "A",
                rationale: "The oviduct (Fallopian tube) receives the egg at ovulation and acts as a conduit for sperm. Fertilization normally takes place in the ampulla, which is the intermediate 2/3 of the tube.",
                source: "Female Reproductive Histology Handout PDF, page 7: 'receives egg at ovulation, conduit for sperm, fertilization normally in ampula (distal 1/3 of tube)'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO1: List the organs of the female reproductive tract and identify their locations and functions (relative to menstrual cycle).",
                question: "A 35-year-old woman undergoes a transvaginal ultrasound to evaluate abnormal uterine bleeding. The sonographer assesses the thickness of the uterine wall. The innermost mucosal layer of the uterine body undergoes monthly cyclic changes in thickness and morphology. Which specific portion of this layer is normally sloughed off during menstruation?",
                options: {
                    A: "Basal layer of the endometrium",
                    B: "Functional layer of the endometrium",
                    C: "Inner circular layer of the myometrium",
                    D: "Outer longitudinal layer of the myometrium",
                    E: "Perimetrium"
                },
                correctAnswer: "B",
                rationale: "The endometrium consists of a basal layer that remains intact and a functional layer. The functional layer is sloughed off during menstruation and undergoes cyclic changes in response to estrogen and progesterone.",
                source: "Female Reproductive Histology Handout PDF, page 8: 'basal layer –remains intact | functional layer – sloughed off during menstruation; during the menstrual cycle... the epithelium in the functional layer is subject to monthly cyclic changes'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO2: Describe the microscopic organization of the ovary. Outline the different stages of follicular differentiation relative to stage of oogenesis and hormonal control.",
                question: "A pathologist examines a histological section of a normal ovary from a 22-year-old woman. She identifies numerous small follicles located just beneath the tunica albuginea. These follicles consist of a large, round oocyte surrounded by a single layer of squamous cells. At what stage of oogenesis are the oocytes within these specific follicles arrested?",
                options: {
                    A: "Metaphase of meiosis I",
                    B: "Metaphase of meiosis II",
                    C: "Prophase of meiosis I",
                    D: "Prophase of meiosis II",
                    E: "Telophase of meiosis II"
                },
                correctAnswer: "C",
                rationale: "Primordial follicles are characterized by a large round oocyte surrounded by a single layer of squamous cells. All follicles remain at the primordial stage until puberty, and the oocytes within them are arrested in prophase of meiosis I.",
                source: "Female Reproductive Histology Handout PDF, page 2: 'Primordial follicle • large round oocyte surrounded by single layer squamous cells... all follicles primordial till puberty; oocyte arrested in prophase of meiosis I'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO2: Describe the microscopic organization of the ovary. Outline the different stages of follicular differentiation relative to stage of oogenesis and hormonal control.",
                question: "An ovarian biopsy from a woman undergoing fertility treatment reveals a developing follicle characterized by a stratified epithelial layer of granulosa cells and the appearance of a refractile, deeply-staining layer immediately surrounding the oocyte. Stromal cells have begun to organize around the follicle, but no fluid-filled cavities are present. Which of the following best describes this stage of follicular development?",
                options: {
                    A: "Mature (Graafian) follicle",
                    B: "Primary multilaminar follicle",
                    C: "Primary unilaminar follicle",
                    D: "Primordial follicle",
                    E: "Secondary (antral) follicle"
                },
                correctAnswer: "B",
                rationale: "The primary multilaminar follicle is defined by the proliferation of follicular cells to form a stratified epithelial layer (granulosa cells) and the formation of the refractile zona pellucida separating the oocyte and granulosa layer. Fluid-filled cavities (antrum) do not appear until the secondary (antral) stage.",
                source: "Female Reproductive Histology Handout PDF, page 2: 'Primary multilaminar follicle • follicular cells proliferate to form stratified epithelial layer of granulosa (follicular) cells • oocyte and granulosa layer separated by refractile, deeply-staining zona pellucida'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO3: Describe the microscopic organization of the corpus luteum relative to stage of menstrual cycle.",
                question: "Following ovulation, the remaining follicle wall collapses and undergoes profound histological changes to form the corpus luteum. During this transformation, which of the following vital structural events occurs to allow the corpus luteum to function as an effective endocrine organ?",
                options: {
                    A: "Capillaries invade the follicular epithelium",
                    B: "Granulosa cells undergo widespread apoptosis",
                    C: "The basal lamina thickens into a dense fibrotic scar",
                    D: "The theca externa differentiates into squamous epithelium",
                    E: "The zona pellucida expands to fill the antrum"
                },
                correctAnswer: "A",
                rationale: "After ovulation, the remaining follicle wall collapses. The granulosa and theca interna cells accumulate lipid and enlarge. A critical step in this transformation into an active endocrine organ is the invasion of capillaries into the previously avascular follicular epithelium.",
                source: "Female Reproductive Histology Handout PDF, page 5: 'Corpus Luteum • following ovulation the remaining follicle wall collapses... • capillaries invade follicular epithelium!!!'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO3: Describe the microscopic organization of the corpus luteum relative to stage of menstrual cycle.",
                question: "A 26-year-old woman is in the late luteal phase of her menstrual cycle. Because fertilization did not occur, her corpus luteum undergoes generalized degeneration. Histologically, the active steroid-secreting cells are replaced by a connective tissue scar. What is the correct anatomical term for this residual structure?",
                options: {
                    A: "Atretic follicle",
                    B: "Corpus albicans",
                    C: "Corpus hemorrhagicum",
                    D: "Stigma",
                    E: "Theca lutein"
                },
                correctAnswer: "B",
                rationale: "If fertilization does not occur, the corpus luteum degenerates and is replaced by a connective tissue scar known as the corpus albicans.",
                source: "Female Reproductive Histology Handout PDF, page 5: 'Corpus albicans • without fertilization – generalized degeneration of corpus luteum, replaced with ct scar'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO4: Know the microscopic organization of the oviducts / uterine tubes. Understand final stages of spermatozoa maturation (capacitation) & acrosome reaction for fertilization.",
                question: "A histological section of the ampulla of the oviduct is examined under a microscope. The epithelium is simple columnar and consists of both secretory cells and ciliated cells. Which of the following hormones is directly responsible for increasing the number of cilia and their rate of beating toward the uterus?",
                options: {
                    A: "Estrogen",
                    B: "Human chorionic gonadotropin (hCG)",
                    C: "Luteinizing hormone",
                    D: "Progesterone",
                    E: "Prolactin"
                },
                correctAnswer: "A",
                rationale: "The epithelium of the oviduct consists of simple columnar ciliated and secretory cells. Estrogen stimulates the generation of cilia and increases both the number of cilia and their rate of beating toward the uterus, whereas progesterone inhibits this activity.",
                source: "Female Reproductive Histology PDF, slide 36: 'Epithelial/Muscular changes in oviduct under estrogen control... Ciliated cells (due to influence of estrogen cells generated cilia; # and rate of beating (toward uterus) increases due to estrogen; progesterone inhibits'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO4: Know the microscopic organization of the oviducts / uterine tubes. Understand final stages of spermatozoa maturation (capacitation) & acrosome reaction for fertilization.",
                question: "In an in vitro fertilization clinic, spermatozoa must undergo a specific maturation step before they are capable of initiating the acrosome reaction and fertilizing an egg. This process involves the modification of the glycoprotein coat and the removal of seminal proteins from the sperm surface. This final step of spermatozoa maturation is known as:",
                options: {
                    A: "Capacitation",
                    B: "Meiosis II",
                    C: "Oocyte maturation inhibition",
                    D: "Syngamy",
                    E: "Zonal digestion"
                },
                correctAnswer: "A",
                rationale: "Capacitation is the final step of spermatozoa maturation. It is a process whereby the glycoprotein coat is modified and seminal proteins are removed from the surface of the sperm. Only after capacitation can the acrosomal reaction occur.",
                source: "Female Reproductive Histology PDF, slide 42: 'capacitation –final step of spermatorzoa maturation -A process whereby the glycoprotein coat is modified and seminal proteins are removed from the surface of the sperm. - After capacitation, the acrosomal reaction can occur.'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO5: Relate the microscopic organization of the uterus to stage of the menstrual cycle and its role in fetal development.",
                question: "A 30-year-old woman undergoes an endometrial biopsy on day 21 of a standard 28-day menstrual cycle. Histological evaluation shows a thick endometrium with highly coiled, elongated glands appearing as sacculations. The stroma is edematous, and the glandular epithelium is actively secreting glycogen. These specific histological changes are primarily driven by which of the following hormones?",
                options: {
                    A: "Estrogen",
                    B: "Follicle-stimulating hormone",
                    C: "Luteinizing hormone",
                    D: "Progesterone",
                    E: "Prolactin"
                },
                correctAnswer: "D",
                rationale: "Day 21 corresponds to the Secretory (Luteal) Phase (days 14-27). This phase is characterized by elongated, highly coiled glands (sacculations), an edematous stroma, and glycogen secretion. These changes are mainly due to the action of progesterone secreted by the corpus luteum.",
                source: "Female Reproductive Histology Handout PDF, page 9: 'Secretory (Luteal) Phase • day 14-27 • further thickening of endometrium -glands elongate and become highly coiled (appears as sacculations in sections) • stroma proliferates and becomes edematous • glandular epithelium synthesizes and secretes glycogen • changes mainly due to progesterone'"
            },
            {
                section: "Female Reproductive Histology",
                fullLO: "LO5: Relate the microscopic organization of the uterus to stage of the menstrual cycle and its role in fetal development.",
                question: "A 25-year-old woman is in the final days of her menstrual cycle (day 28), and pregnancy has not occurred. The endometrial tissue exhibits a dramatic reduction in thickness due to loss of fluid, followed by necrosis of the superficial three-quarters of the functional layer. Which of the following vascular events directly initiates this ischemic phase?",
                options: {
                    A: "Constriction of the arcuate arteries",
                    B: "Constriction of the spiral (coiled) arteries",
                    C: "Dilation of the basal arteries",
                    D: "Dilation of the straight arteries",
                    E: "Rupture of the myometrial capillary plexus"

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Female Reproductive Histology")) btnText = "Female Repro Histology";
                    if (btnText.includes("Breast Histology")) btnText = "Breast Histology";
                    if (btnText.includes("Lower Gynecologic Pathology")) btnText = "Lower GYN Path";
                    if (btnText.includes("Female Reproductive Disorders")) btnText = "Female Repro Disorders";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
            
            const loBox = document.getElementById(`lo-${index}`);
            loBox.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
